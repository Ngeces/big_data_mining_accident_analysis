<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="640" viewBox="0 0 1400 640" font-family="Arial, Helvetica, 'DejaVu Sans', sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5f6368"/></marker></defs><rect width="1400" height="640" fill="#ffffff"/><text x="700" y="38" font-size="22" font-weight="bold" fill="#1f2328" text-anchor="middle">Skema Graf Heterogen: Tambang – Standar Pelanggaran – Tipe Kecelakaan</text><rect x="30" y="70" width="640" height="470" rx="14" fill="#fbfcfe" stroke="#e3e7ee" stroke-width="1.6"/><text x="350" y="102" font-size="15" font-weight="bold" fill="#5f6b7a" text-anchor="middle">(a) Skema simpul dan sisi</text><polygon points="115,244 171,300 115,356 59,300" fill="#fce8e6" stroke="#c5221f" stroke-width="2.4"/><text x="115" y="305" font-size="13" font-weight="bold" fill="#c5221f" text-anchor="middle">standard</text><circle cx="345" cy="300" r="52" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2.4"/><text x="345" y="305" font-size="15" font-weight="bold" fill="#1a73e8" text-anchor="middle">mine</text><rect x="539" y="254" width="92" height="92" rx="6" fill="#e6f4ea" stroke="#188038" stroke-width="2.4"/><text x="585" y="305" font-size="14" font-weight="bold" fill="#188038" text-anchor="middle">type</text><line x1="171" y1="300" x2="293" y2="300" stroke="#5f6368" stroke-width="2"/><line x1="397" y1="300" x2="539" y2="300" stroke="#5f6368" stroke-width="2"/><line x1="171" y1="300" x2="293" y2="300" stroke="#c5221f" stroke-width="3"/><line x1="397" y1="300" x2="539" y2="300" stroke="#188038" stroke-width="3"/><text x="232" y="290" font-size="11.5" font-weight="bold" fill="#c5221f" text-anchor="middle">CITED_FOR</text><text x="468" y="290" font-size="11.5" font-weight="bold" fill="#188038" text-anchor="middle">REPORTED_ACCIDENT</text><text x="232" y="318" font-size="11" font-weight="normal" fill="#5f6b7a" text-anchor="middle">w = jumlah</text><text x="232" y="332" font-size="11" font-weight="normal" fill="#5f6b7a" text-anchor="middle">pelanggaran</text><text x="468" y="318" font-size="11" font-weight="normal" fill="#5f6b7a" text-anchor="middle">w = jumlah</text><text x="468" y="332" font-size="11" font-weight="normal" fill="#5f6b7a" text-anchor="middle">kecelakaan</text><text x="115" y="385" font-size="12" font-weight="normal" fill="#5f6b7a" text-anchor="middle">standard::&lt;PART_SECTION&gt;</text><text x="115" y="402" font-size="12" font-weight="normal" fill="#5f6b7a" text-anchor="middle">pasal 30 CFR (Violations)</text><text x="345" y="385" font-size="12" font-weight="normal" fill="#5f6b7a" text-anchor="middle">mine::&lt;MINE_ID&gt;</text><text x="345" y="402" font-size="12" font-weight="normal" fill="#5f6b7a" text-anchor="middle">tambang</text><text x="585" y="385" font-size="12" font-weight="normal" fill="#5f6b7a" text-anchor="middle">accident_type::&lt;ACCIDENT_TYPE&gt;</text><text x="585" y="402" font-size="12" font-weight="normal" fill="#5f6b7a" text-anchor="middle">tipe kecelakaan (Accidents)</text><text x="350" y="455" font-size="12.5" font-weight="normal" fill="#5f6b7a" text-anchor="middle">Graf tidak berarah, periode Accidents dan Violations sama (2020–2023).</text><text x="350" y="475" font-size="12.5" font-weight="normal" fill="#5f6b7a" text-anchor="middle">Metrik: weighted degree, PageRank, afinitas &amp; lift, cosine similarity.</text><text x="350" y="505" font-size="12.5" font-weight="bold" fill="#5f6b7a" text-anchor="middle">Sisi = kejadian di tambang yang sama, bukan hubungan sebab-akibat.</text><rect x="700" y="70" width="670" height="470" rx="14" fill="#fbfcfe" stroke="#e3e7ee" stroke-width="1.6"/><text x="1035" y="102" font-size="15" font-weight="bold" fill="#5f6b7a" text-anchor="middle">(b) Proyeksi mine-to-mine untuk deteksi komunitas</text><line x1="816" y1="200" x2="938" y2="160" stroke="#9aa0a6" stroke-width="1.8"/><line x1="816" y1="200" x2="938" y2="260" stroke="#9aa0a6" stroke-width="1.8"/><line x1="816" y1="200" x2="938" y2="360" stroke="#9aa0a6" stroke-width="1.8"/><line x1="816" y1="400" x2="938" y2="260" stroke="#9aa0a6" stroke-width="1.8"/><line x1="816" y1="400" x2="938" y2="360" stroke="#9aa0a6" stroke-width="1.8"/><line x1="816" y1="400" x2="938" y2="450" stroke="#9aa0a6" stroke-width="1.8"/><circle cx="790" cy="200" r="26" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2.4"/><text x="790" y="205" font-size="15" font-weight="bold" fill="#1a73e8" text-anchor="middle">A</text><circle cx="790" cy="400" r="26" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2.4"/><text x="790" y="405" font-size="15" font-weight="bold" fill="#1a73e8" text-anchor="middle">B</text><polygon points="960,136 984,160 960,184 936,160" fill="#fce8e6" stroke="#c5221f" stroke-width="2.4"/><text x="960" y="165" font-size="12" font-weight="bold" fill="#c5221f" text-anchor="middle">S1</text><polygon points="960,236 984,260 960,284 936,260" fill="#fce8e6" stroke="#c5221f" stroke-width="2.4"/><text x="960" y="265" font-size="12" font-weight="bold" fill="#c5221f" text-anchor="middle">S2</text><rect x="940" y="340" width="40" height="40" rx="6" fill="#e6f4ea" stroke="#188038" stroke-width="2.4"/><text x="960" y="365" font-size="12" font-weight="bold" fill="#188038" text-anchor="middle">T1</text><rect x="940" y="430" width="40" height="40" rx="6" fill="#e6f4ea" stroke="#188038" stroke-width="2.4"/><text x="960" y="455" font-size="12" font-weight="bold" fill="#188038" text-anchor="middle">T2</text><path d="M 1010 305 L 1085 305" fill="none" stroke="#5f6368" stroke-width="1.8" marker-end="url(#arrow)"/><circle cx="1150" cy="230" r="26" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2.4"/><text x="1150" y="235" font-size="15" font-weight="bold" fill="#1a73e8" text-anchor="middle">A</text><circle cx="1150" cy="380" r="26" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2.4"/><text x="1150" y="385" font-size="15" font-weight="bold" fill="#1a73e8" text-anchor="middle">B</text><line x1="1150" y1="256" x2="1150" y2="354" stroke="#1a73e8" stroke-width="3.2"/><text x="1275" y="300" font-size="13" font-weight="bold" fill="#1a73e8" text-anchor="middle">Jaccard(A, B)</text><text x="1275" y="320" font-size="12" font-weight="normal" fill="#5f6b7a" text-anchor="middle">= |{S2, T1}| / |{S1, S2, T1, T2}|</text><text x="1275" y="338" font-size="12" font-weight="normal" fill="#5f6b7a" text-anchor="middle">= 2 / 4 = 0,50</text><text x="1035" y="500" font-size="12.5" font-weight="normal" fill="#5f6b7a" text-anchor="middle">300 tambang dengan weighted degree tertinggi · sisi jika Jaccard &gt;= 0,20 ·</text><text x="1035" y="520" font-size="12.5" font-weight="normal" fill="#5f6b7a" text-anchor="middle">bobot = Jaccard · komunitas: Louvain (seed 42)</text><circle cx="60" cy="590" r="13" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2.4"/><text x="60" y="595" font-size="13" font-weight="bold" fill="#1a73e8" text-anchor="middle"></text><text x="82" y="595" font-size="13" font-weight="normal" fill="#5f6b7a" text-anchor="start">tambang</text><polygon points="200,575 215,590 200,605 185,590" fill="#fce8e6" stroke="#c5221f" stroke-width="2.4"/><text x="200" y="595" font-size="13" font-weight="bold" fill="#c5221f" text-anchor="middle"></text><text x="222" y="595" font-size="13" font-weight="normal" fill="#5f6b7a" text-anchor="start">standar 30 CFR</text><rect x="368" y="578" width="24" height="24" rx="6" fill="#e6f4ea" stroke="#188038" stroke-width="2.4"/><text x="380" y="595" font-size="13" font-weight="bold" fill="#188038" text-anchor="middle"></text><text x="402" y="595" font-size="13" font-weight="normal" fill="#5f6b7a" text-anchor="start">tipe kecelakaan</text></svg>